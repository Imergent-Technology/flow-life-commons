# CI runs the same tooling developers run locally: ./flow check.
# There is deliberately no CI-only test logic here. CI only, no deployment.
name: CI

# NOTE: paths-ignore skips docs-only changes to save minutes. A skipped workflow
# reports no status, so revisit this BEFORE making the job below a required check
# in branch protection (see docs/development/testing.md). workflow_dispatch is the
# escape hatch: it runs the same job on demand, including for docs-only commits.
on:
  # Manual trigger: ./flow ci run, or the Actions tab. GitHub only offers this
  # once the workflow file carrying it is on the default branch.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# A newer push to the same branch/PR cancels the superseded run; main always completes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: ./flow check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Shared GitHub-hosted egress IPs exhaust anonymous Docker Hub quotas.
      # Bake still HEADs every FROM on a cache hit; compose and `docker run`
      # later pull caddy/mariadb/node/mailpit/postgres/shellcheck/actionlint/
      # php:8.3-apache. Route docker.io through Google's public cache first.
      # The PHP Dockerfile names mirror.gcr.io / GHCR directly so the images
      # Bake must resolve never fall back to docker.io (mlocati is not cached).
      - name: Route Docker Hub through mirror.gcr.io
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          cfg = {}
          if path.exists() and path.stat().st_size:
              cfg = json.loads(path.read_text())
          mirrors = list(cfg.get("registry-mirrors") or [])
          if "https://mirror.gcr.io" not in mirrors:
              mirrors.append("https://mirror.gcr.io")
          cfg["registry-mirrors"] = mirrors
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          PY
          sudo systemctl restart docker
          docker info >/dev/null

      - uses: docker/setup-buildx-action@v4
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]

      # Only the PHP image is built from source; layer cache keeps this to seconds
      # when the Dockerfile has not changed. Same image tag as `./flow setup` builds.
      - name: Build PHP development image (layer-cached)
        uses: docker/bake-action@v7
        with:
          files: compose.yaml
          targets: platform
          load: true
          set: |
            *.cache-from=type=gha,scope=flow-dev-php
            *.cache-to=type=gha,scope=flow-dev-php,mode=max

      - name: Set up environment
        run: ./flow setup --skip-build

      # Repo hygiene, Pint, Larastan, Pest (MariaDB + architecture tests),
      # PostgreSQL run of the suite, tsc, ESLint, Prettier, Vitest, production build.
      - name: Run all checks
        run: ./flow check --pgsql

      - name: Service logs (on failure)
        if: failure()
        run: ./flow logs --no-follow
