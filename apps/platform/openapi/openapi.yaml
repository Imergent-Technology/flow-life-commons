      parameters:
        - $ref: '#/components/parameters/ResourcePackId'
        - $ref: '#/components/parameters/ResourceCardId'
        - name: disposition
          in: query
          required: false
          description: '`attachment` (the default) or `inline`. Inline is honoured only for a PDF or a raster image; any other file is still an attachment.'
          schema: {type: string, enum: [attachment, inline]}
      responses:
        '200':
          description: >-
            The file's bytes, streamed. `Content-Type` is the stored, allowlisted type; `Content-Disposition` is `attachment` (or
            `inline`, only when asked for and the file is a PDF or a raster image) with the sanitised original name, encoded per
            RFC 6266 (`filename`, and `filename*` when the name is not plain ASCII); `Cache-Control: private, no-store`;
            `X-Content-Type-Options: nosniff`; and the platform's security headers, including the production CSP.
          headers:
            Content-Disposition:
              schema: {type: string}
            Content-Length:
              schema: {type: integer}
            Cache-Control:
              schema: {type: string, enum: ['no-store, private']}
          content:
            application/pdf: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            text/plain: {schema: {type: string, format: binary}}
            text/csv: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.presentationml.presentation: {schema: {type: string, format: binary}}
        '401':
          description: 'Not signed in, the session has expired, or the account can no longer sign in.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: 'Signed in, but the account does not hold the required capability (or cannot use the Console).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: 'No such resource (`resource_pack_not_found`), or, for a Card the viewer can see, its file is missing from the store (`asset_unavailable`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
        '422':
          description: 'An unknown `disposition`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-flowlife-session
      description: >-
        Same-origin, host-only session cookie (ADR 0016). Not readable by scripts.
        Bounded by 30 minutes of request inactivity and a 12-hour absolute lifetime.
  parameters:
    AccountId:
      name: account
      in: path
      required: true
      description: An Account's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    PersonId:
      name: person
      in: path
      required: true
      description: A Person's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    MembershipGrantId:
      name: grant
      in: path
      required: true
      description: A membership grant's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    ContactMethodId:
      name: method
      in: path
      required: true
      description: A contact method's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    InteractionId:
      name: interaction
      in: path
      required: true
      description: A note or interaction's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    ContactTagId:
      name: tag
      in: path
      required: true
      description: A tag's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    DiscussionId:
      name: discussion
      in: path
      required: true
      description: A discussion's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    DiscussionMessageId:
      name: message
      in: path
      required: true
      description: A discussion message's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        The value of the `XSRF-TOKEN` cookie. Required for state-changing requests
        unless the browser marks the request `Sec-Fetch-Site: same-origin`.
      schema:
        type: string
    ResourceCategoryId:
      name: category
      in: path
      required: true
      description: A Resource Category's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    ResourcePackId:
      name: pack
      in: path
      required: true
      description: A Resource Pack's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
    ResourceCardId:
      name: card
      in: path
      required: true
      description: A Resource Card's identifier (a 26-character ULID).
      schema:
        type: string
        pattern: '^[0-9a-z]{26}$'
  schemas:
    Health:
      type: object
      required: [status, service, api_version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          examples: [flowlife-platform]
        api_version:
          type: string
          examples: [v1]
        checks:
          type: object
          description: Named checks and their result.
          additionalProperties:
            type: string
            enum: [ok, fail]

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CodedMessage:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          description: A stable, machine-readable reason. Clients branch on this, never on `message`.
    CodedValidationError:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    VerificationRequiredOrDenied:
      type: object
      required: [message]
      properties:
        message:
          type: string
        verification_required:
          type: boolean
          description: Present and `true` when the account holds the capability but its proof is stale.
    ManagedAccount:
      type: object
      description: >-
        An Account as an operator administers it. Administration-relevant fields only: never a password or hash,
        a factor secret or recovery code, an invitation token, a session id or audit content.
      required: [id, person_id, display_name, email, email_verified_at, status, created_at, last_login_at, disabled_at, mfa, invitation, assignments]
      properties:
        id: {type: string}
        person_id: {type: string}
        display_name: {type: string}
        email: {type: string}
        email_verified_at:
          type: [string, 'null']
          format: date-time
          description: When the platform first had evidence the holder controls the mailbox (accepting an emailed invitation). Null otherwise.
        status:
          type: string
          enum: [invited, active, disabled]
        created_at: {type: string, format: date-time}
        last_login_at: {type: [string, 'null'], format: date-time}
        disabled_at: {type: [string, 'null'], format: date-time}
        mfa:
          type: object
          required: [enrolled, recovery_codes_remaining]
          properties:
            enrolled: {type: boolean}
            recovery_codes_remaining: {type: integer}
        invitation:
          description: The outstanding (never accepted) invitation, or null.
          type: [object, 'null']
          required: [expires_at, expired, delivery]
          properties:
            expires_at: {type: string, format: date-time}
            expired: {type: boolean}
            delivery:
              type: string
              enum: [email, operator]
              description: How it reached its holder. Only an `email` invitation verifies the email when accepted.
        assignments:
          type: array
          description: What the Account's Person holds, as catalog data from Access. For display; the Console never decides from it.
          items:
            type: object
            required: [key, name, description, granted_at]
            properties:
              key: {type: string}
              name: {type: string}
              description: '{type: string}'
              granted_at: {type: string, format: date-time}
    ManagedAccountPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManagedAccount'
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}
    RoleCatalog:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [key, name, description, capabilities]
            properties:
              key: {type: string}
              name: {type: string}
              description: '{type: string}'
              capabilities:
                type: array
                description: Informational. Nothing decides from this but Access.
                items: {type: string}
    InviteOperatorRequest:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
          maxLength: 254
        display_name:
          type: string
          maxLength: 200
        initial_assignments:
          type: array
          maxItems: 10
          description: Role keys from `GET /admin/roles`. Optional; none is required for the Account to be created.
          items: {type: string, maxLength: 64}
    InviteExistingPersonRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
    GrantRoleRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          maxLength: 64
          description: A role key from `GET /admin/roles`. A capability cannot be named here.
    MembershipGrant:
      type: object
      description: >-
        One time-bounded grant of membership access (ADR 0028). Never a payment fact: Commons
        owns organizational entitlement, not billing state (ADR 0029).
      required: [id, person_id, starts_at, ends_at, source, source_reference, revoked_at]
      properties:
        id: {type: string}
        person_id: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at:
          type: [string, 'null']
          format: date-time
          description: Null is an explicit, approved open-ended grant, never "no end date entered yet".
        source:
          type: string
          enum: [operator, luma_legacy]
        source_reference:
          type: [string, 'null']
          maxLength: 191
          description: An opaque provenance handle for a human investigating a grant. Never parsed, never identity.
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: Null unless this grant was revoked. One-way; never becomes null again.
    MembershipGrantHistoryEntry:
      type: object
      description: >-
        A grant as it appears inside a Person's history (`Member.grants`): the same facts as
        `MembershipGrant`, without `person_id`, which the enclosing record already states.
      required: [id, starts_at, ends_at, source, source_reference, revoked_at]
      properties:
        id: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at:
          type: [string, 'null']
          format: date-time
          description: Null is an explicit, approved open-ended grant, never "no end date entered yet".
        source:
          type: string
          enum: [operator, luma_legacy]
        source_reference:
          type: [string, 'null']
          maxLength: 191
          description: An opaque provenance handle for a human investigating a grant. Never parsed, never identity.
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: Null unless this grant was revoked. One-way; never becomes null again.
    PersonRef:
      type: object
      required: [id, display_name]
      properties:
        id: {type: string}
        display_name: {type: string}
    ContactProfile:
      type: object
      description: >-
        What CRM holds about a Person beyond their name. Both fields are free text and may be null; a Person CRM knows
        nothing about reads as all nulls. `updated_at` is null when there is no profile row at all.
      required: [how_we_know, affiliation, updated_at]
      properties:
        how_we_know: {type: [string, 'null'], maxLength: 2000}
        affiliation: {type: [string, 'null'], maxLength: 255}
        updated_at: {type: [string, 'null'], format: date-time}
    ContactMethod:
      type: object
      description: >-
        An email address or phone number recorded for a Person. `value` is as the human entered it. Not unique across
        People; unique per Person by kind and normalised value. At most one method per kind is primary.
      required: [id, kind, value, label, is_primary, created_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [email, phone]}
        value: {type: string}
        label: {type: [string, 'null'], maxLength: 64}
        is_primary: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ContactTagRef:
      type: object
      description: A tag as it appears on a Person. A label only.
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ContactTag:
      type: object
      description: A user-managed label, with how many People hold it. It carries no authority and means nothing to the platform.
      required: [id, name, person_count]
      properties:
        id: {type: string}
        name: {type: string, maxLength: 64}
        person_count: {type: integer}
    ContactTagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactTag'
    PersonTagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactTagRef'
    PersonRecord:
      type: object
      description: >-
        A Person as CRM knows them: their id and name (Identity's), and CRM's profile, contact methods and tags.
        Deliberately without Membership, Account or Commons-access state.
      required: [person, profile, contact_methods, tags]
      properties:
        person:
          $ref: '#/components/schemas/PersonRef'
        profile:
          $ref: '#/components/schemas/ContactProfile'
        contact_methods:
          type: array
          description: By kind, then when recorded.
          items:
            $ref: '#/components/schemas/ContactMethod'
        tags:
          type: array
          description: By name.
          items:
            $ref: '#/components/schemas/ContactTagRef'
    PersonUpdate:
      type: object
      required: [person, profile]
      properties:
        person:
          $ref: '#/components/schemas/PersonRef'
        profile:
          $ref: '#/components/schemas/ContactProfile'
    PersonListing:
      type: object
      description: One row of the People directory.
      required: [id, display_name, primary_email, primary_phone, tags]
      properties:
        id: {type: string}
        display_name: {type: string}
        primary_email: {type: [string, 'null']}
        primary_phone: {type: [string, 'null']}
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactTagRef'
    PersonListingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PersonListing'
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}
    Interaction:
      type: object
      description: >-
        A note about a Person, or a record of a conversation with them. `occurred_at` is when the contact happened; `created_at` is
        when it was recorded. `author` is who recorded it; `updated_by` is who last corrected it, and is null until someone does. Both
        are Persons, shown by their current name, and are null only if Identity no longer holds that Person. No Account is exposed.
      required: [id, kind, body, occurred_at, author, updated_by, created_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [note, call, email, meeting]}
        body: {type: string, minLength: 1, maxLength: 5000}
        occurred_at: {type: string, format: date-time}
        author:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    InteractionPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Interaction'
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}
    NewInteraction:
      type: object
      required: [body]
      properties:
        kind: {type: string, enum: [note, call, email, meeting], default: note}
        body: {type: string, minLength: 1, maxLength: 5000, description: 'Trimmed. Line endings (CRLF, lone CR) become LF. Newlines and tabs are kept; other control characters (Unicode Cc) are refused, while formatting characters such as ZWNJ and ZWJ are ordinary text.'}
        occurred_at:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 with a UTC offset (`Z` allowed). Null or absent means now. Not in the future.
    EditInteractionRequest:
      type: object
      description: At least one property.
      properties:
        kind: {type: string, enum: [note, call, email, meeting]}
        body: {type: string, minLength: 1, maxLength: 5000}
        occurred_at: {type: string, format: date-time}
    NewContactMethod:
      type: object
      required: [kind, value]
      properties:
        kind: {type: string, enum: [email, phone]}
        value: {type: string, maxLength: 255}
        label: {type: [string, 'null'], maxLength: 64}
        is_primary: {type: boolean}
    UpdateContactMethodRequest:
      type: object
      description: At least one property.
      properties:
        value: {type: string, maxLength: 255}
        label: {type: [string, 'null'], maxLength: 64}
        is_primary: {type: boolean}
    RegisterPersonRequest:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 255}
        how_we_know: {type: [string, 'null'], maxLength: 2000}
        affiliation: {type: [string, 'null'], maxLength: 255}
        contact_methods:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NewContactMethod'
        confirm_distinct:
          type: boolean
          description: Register this Person even though possible duplicates were reported. It skips only that advice, never validation.
    UpdatePersonRequest:
      type: object
      description: At least one property. A name cannot be cleared; a profile field set to null or blank is.
      properties:
        display_name: {type: string, minLength: 1, maxLength: 255}
        how_we_know: {type: [string, 'null'], maxLength: 2000}
        affiliation: {type: [string, 'null'], maxLength: 255}
    SetPersonTagsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          maxItems: 200
          items: {type: string}
    TagNameRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
    PossibleDuplicate:
      type: object
      description: People who look like the one being registered. Directory information only (id and display name), plus what matched.
      required: [message, code, candidates]
      properties:
        message: {type: string}
        code: {type: string, enum: [possible_duplicate]}
        candidates:
          type: array
          items:
            type: object
            required: [id, display_name, matched_on]
            properties:
              id: {type: string}
              display_name: {type: string}
              matched_on:
                type: array
                items: {type: string, enum: [email, display_name]}
    Member:
      type: object
      description: >-
        A Person's membership state, derived at the instant it was read, and their complete grant
        history. The Console concept is "Member"; the backend truth is a Person plus grant history —
        there is no stored Member row.
      required: [person, active, current_access_ends_at, open_ended, grants]
      properties:
        person:
          type: object
          required: [id, display_name]
          properties:
            id: {type: string}
            display_name: {type: string}
        active: {type: boolean}
        current_access_ends_at:
          type: [string, 'null']
          format: date-time
          description: Null when access is not currently active, or when the current access run is open-ended.
        open_ended: {type: boolean}
        grants:
          type: array
          description: >-
            The complete history, oldest first, including revoked, expired and future grants. Each entry
            omits `person_id`: the record it is nested in already names the one Person.
          items:
            $ref: '#/components/schemas/MembershipGrantHistoryEntry'
    MemberPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}
    CurrentMembershipGrant:
      type: object
      description: >-
        A grant as it appears in the caller's OWN membership history (`GET /my/membership`).
        Deliberately narrower than `MembershipGrantHistoryEntry`: no `id` (an internal reference,
        not something a Member acts on), no `source`/`source_reference` (how or why an operator
        granted it), and revocation is the boolean fact `revoked`, not the instant it happened.
      required: [starts_at, ends_at, revoked]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at:
          type: [string, 'null']
          format: date-time
          description: Null is an explicit, approved open-ended grant, never "no end date entered yet".
        revoked: {type: boolean}
    CurrentMembership:
      type: object
      description: >-
        The signed-in Account's own membership state and grant history (ADR 0032). Carries no
        administrative provenance: not who granted or revoked anything, and not why. `active: false`
        is as ordinary an answer as `active: true` — this is never evidence of membership by itself.
      required: [active, current_access_ends_at, open_ended, grants]
      properties:
        active: {type: boolean}
        current_access_ends_at:
          type: [string, 'null']
          format: date-time
          description: Null when access is not currently active, or when the current access run is open-ended.
        open_ended: {type: boolean}
        grants:
          type: array
          description: The complete history, oldest first, including revoked, expired and future grants.
          items:
            $ref: '#/components/schemas/CurrentMembershipGrant'
    RegisterMemberRequest:
      type: object
      required: [display_name, starts_at, open_ended, ends_at, source]
      properties:
        display_name:
          type: string
          maxLength: 255
        starts_at:
          type: string
          format: date-time
        open_ended:
          type: boolean
          description: >-
            Required. `true` declares open-ended access and requires `ends_at: null`; `false` declares a
            bounded term and requires an `ends_at` after `starts_at`. Open-ended access is never inferred
            from a blank or absent end date.
        ends_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Required key. `null` only with `open_ended: true`; a datetime only with `open_ended: false`.
            A blank string is not a datetime and is refused.
        source:
          type: string
          enum: [operator, luma_legacy]
        source_reference:
          type: [string, 'null']
          maxLength: 191
    GrantMembershipRequest:
      type: object
      required: [starts_at, open_ended, ends_at, source]
      properties:
        starts_at:
          type: string
          format: date-time
        open_ended:
          type: boolean
          description: >-
            Required. `true` declares open-ended access and requires `ends_at: null`; `false` declares a
            bounded term and requires an `ends_at` after `starts_at`. Open-ended access is never inferred
            from a blank or absent end date.
        ends_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Required key. `null` only with `open_ended: true`; a datetime only with `open_ended: false`.
            A blank string is not a datetime and is refused.
        source:
          type: string
          enum: [operator, luma_legacy]
        source_reference:
          type: [string, 'null']
          maxLength: 191
    InvitationResult:
      type: object
      required: [account, delivery]
      properties:
        account:
          $ref: '#/components/schemas/ManagedAccount'
        delivery:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [sent, failed]
              description: >-
                Whether the mail system accepted the message. `failed` leaves the Account and its invitation committed;
                issue a fresh invitation. The secret is never in this response.
    PasswordResetResult:
      type: object
      required: [account, delivery]
      properties:
        account:
          $ref: '#/components/schemas/ManagedAccount'
        delivery:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [sent, failed]
              description: >-
                Whether the mail system accepted the message. It says nothing about the inbox. The reset link and everything
                needed to build one reach only the Account holder's address, never this response.
    CommonsAccess:
      type: object
      description: >-
        Whether a Person has a Commons Account yet (ADR 0032, Work Package 5), and the one thing an
        operator might do about it. Never an Account id, an email or a role.
      required: [commons_access]
      properties:
        commons_access:
          type: object
          required: [state, can_invite]
          properties:
            state:
              type: string
              enum: [not_invited, invited, active, disabled]
              description: >-
                `not_invited`: no Commons Account exists yet. The other three mirror the Account's own
                status once one does.
            can_invite:
              type: boolean
              description: True exactly when `state` is `not_invited`. Derived, not an independent choice.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: Printable ASCII; internationalised domains as punycode. Matched case-insensitively.
        password:
          type: string
          maxLength: 1024
          writeOnly: true
    AcceptInvitationRequest:
      type: object
      required: [token, password, password_confirmation]
      properties:
        token:
          type: string
          maxLength: 256
          writeOnly: true
          description: The one-time invitation token (43 URL-safe characters). Secret.
        password:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: See "Passwords" above. Secret; used exactly as typed.
        password_confirmation:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: Must equal `password` once both are normalised. Secret.
    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: The account's current password, re-proved. Secret.
        password:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: The new password. See "Passwords" above. Secret; used exactly as typed.
        password_confirmation:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: Must equal `password` once both are normalised. Secret.
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          description: Printable ASCII; internationalised domains as punycode. Matched case-insensitively.
    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email:
          type: string
          maxLength: 254
          description: The address the reset was requested for (carried in the emailed link).
        token:
          type: string
          maxLength: 256
          writeOnly: true
          description: The single-use reset token from the emailed link. Secret.
        password:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: See "Passwords" above. Secret; used exactly as typed.
        password_confirmation:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: Must equal `password` once both are normalised. Secret.
    PendingSignIn:
      type: object
      description: A sign-in whose password was proved and which is waiting for a second factor. Not authentication.
      required: [next, expires_at]
      properties:
        next:
          type: string
          enum: [challenge, enrollment]
          description: >-
            `challenge`: the account has an authenticator, so present a code (`POST /mfa/challenge`).
            `enrollment`: a second factor is required and the account has none, so enrol one
            (`POST /mfa/enrollment`).
        expires_at:
          type: string
          format: date-time
          description: When this pending sign-in ends, whatever happens. Measured from the password; never extended.
    SecondFactorRequest:
      type: object
      description: Exactly one of `code` and `recovery_code`.
      properties:
        code:
          type: string
          maxLength: 32
          writeOnly: true
          description: A 6-digit code from the authenticator app (spaces are ignored). Secret.
        recovery_code:
          type: string
          maxLength: 64
          writeOnly: true
          description: One of the account's single-use recovery codes (case, hyphens and spaces are ignored). Secret.
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 32
          writeOnly: true
          description: A 6-digit code from the authenticator app (spaces are ignored). Secret.
    SecurityProofRequest:
      type: object
      description: Fresh proof. The current password and exactly one of `code` and `recovery_code`.
      required: [current_password]
      properties:
        current_password:
          type: string
          maxLength: 1024
          format: password
          writeOnly: true
          description: The account's current password, re-proved. Secret.
        code:
          type: string
          maxLength: 32
          writeOnly: true
          description: A 6-digit code from the authenticator app (spaces are ignored). Secret.
        recovery_code:
          type: string
          maxLength: 64
          writeOnly: true
          description: One of the account's single-use recovery codes. Secret.
    AuthenticatorSetup:
      type: object
      description: >-
        What is needed to add an authenticator. Shown **once**, and never retrievable again: the server
        keeps only the encrypted secret. Secret.
      required: [secret, otpauth_uri, expires_at]
      properties:
        secret:
          type: string
          readOnly: true
          description: The base32 secret, for typing into an authenticator app by hand.
        otpauth_uri:
          type: string
          readOnly: true
          description: The `otpauth://` provisioning URI. Render it as a QR code **in the browser**; never send it to a QR-code service. Contains the secret.
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: >-
            The last moment this setup can still be confirmed, decided by the server (the Console shows
            it and never works it out). For an authenticator **replacement** it is when the pending
            secret expires (15 minutes after it was made). For a sign-in **enrolment** it is when the
            pending sign-in ends, which is sooner. After it, confirming answers `422` with
            `errors.authenticator` and the setup must be started again.
    RecoveryCodes:
      type: object
      description: New recovery codes, shown **once** and stored only as digests. Secret.
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          readOnly: true
          items:
            type: string
          description: Ten single-use codes, grouped for reading (`ABCD-EFGH-JKMN-PQRS`).
    CurrentAccount:
      type: object
      required: [account, person, capabilities, session, mfa]
      properties:
        account:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              minLength: 26
              maxLength: 26
              description: Account ULID.
            email:
              type: string
        person:
          type: object
          required: [id, display_name]
          properties:
            id:
              type: string
              minLength: 26
              maxLength: 26
              description: Person ULID. Business modules reference this.
            display_name:
              type: string
        capabilities:
          type: array
          description: >-
            Capability identifiers the account currently holds, alphabetical, possibly
            empty. Derived fresh on every request; never stored in the session. Presentation
            aid only: authorization is always decided server-side.
          items:
            type: string
            examples: [console.access]
        mfa:
          type: object
          description: >-
            Presentation only, and nothing about the factor itself (never a secret, a code or a digest).
          required: [enrolled, recovery_codes_remaining, security_verified_until]
          properties:
            enrolled:
              type: boolean
              description: Whether the account has a proved authenticator.
            recovery_codes_remaining:
              type: integer
              description: How many recovery codes are unused (0 when not enrolled).
            security_verified_until:
              type:
                - string
                - 'null'
              format: date-time
              description: >-
                When this session's recent security verification lapses, or null if it has none or it
                has lapsed. (Whether a route needs it is decided by the server.)
        session:
          type: object
          required: [authenticated_at, absolute_expires_at]
          properties:
            authenticated_at:
              type: string
              format: date-time
              description: When this session was authenticated (UTC). The 12-hour lifetime is measured from here.
            absolute_expires_at:
              type: string
              format: date-time
              description: The latest this session can live, whatever its activity. Inactivity can end it sooner.

    DiscussionPerson:
      type: object
      description: >-
        Who wrote, edited or resolved something: a Person's id and CURRENT display name, so a rename shows on what they wrote. The
        name is null only when Identity no longer holds the Person; the words stay and the author is shown as unknown. No Account,
        login email, role or security state is ever exposed.
      required: [id, display_name]
      properties:
        id: {type: string}
        display_name: {type: [string, 'null']}
    Discussion:
      type: object
      description: >-
        A discussion's header. `creator` is the author of its opening message. `message_count` is the last allocated sequence and
        includes removed messages. `last_activity_at` is when a message was last posted. `resolved_at` and `resolved_by` are null while open.
      required: [id, title, state, creator, message_count, last_activity_at, created_at, resolved_at, resolved_by]
      properties:
        id: {type: string}
        title: {type: string, minLength: 1, maxLength: 200}
        state: {type: string, enum: [open, resolved]}
        creator:
          oneOf:
            - $ref: '#/components/schemas/DiscussionPerson'
            - type: 'null'
        message_count: {type: integer, minimum: 1}
        last_activity_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolved_by:
          oneOf:
            - $ref: '#/components/schemas/DiscussionPerson'
            - type: 'null'
    DiscussionPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Discussion'
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}
    NewDiscussion:
      type: object
      required: [title, body]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, description: 'Trimmed. One line: control characters and line or paragraph separators are refused.'}
        body: {type: string, minLength: 1, maxLength: 10000, description: 'The opening message. Trimmed. Line endings (CRLF, lone CR) become LF. Newlines and tabs are kept; other control characters (Unicode Cc) are refused, while formatting characters such as ZWNJ and ZWJ are ordinary text.'}
    RetitleRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
    NewMessage:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 10000, description: 'Trimmed. Line endings (CRLF, lone CR) become LF. Newlines and tabs are kept; other control characters (Unicode Cc) are refused, while formatting characters such as ZWNJ and ZWJ are ordinary text.'}
    DiscussionMessage:
      oneOf:
        - $ref: '#/components/schemas/LiveMessage'
        - $ref: '#/components/schemas/RemovedMessage'
      discriminator:
        propertyName: removed
        mapping:
          'false': '#/components/schemas/LiveMessage'
          'true': '#/components/schemas/RemovedMessage'
    LiveMessage:
      type: object
      description: >-
        A message with its text. `edited_at` and `edited_by` are null until its author changes the text. There is no history of
        earlier text.
      required: [id, sequence, author, created_at, removed, body, edited_at, edited_by]
      properties:
        id: {type: string}
        sequence: {type: integer, minimum: 1}
        author: {$ref: '#/components/schemas/DiscussionPerson'}
        created_at: {type: string, format: date-time}
        removed: {type: boolean, const: false}
        body: {type: string, minLength: 1, maxLength: 10000}
        edited_at: {type: [string, 'null'], format: date-time}
        edited_by:
          oneOf:
            - $ref: '#/components/schemas/DiscussionPerson'
            - type: 'null'
    RemovedMessage:
      type: object
      description: >-
        A tombstone: the message's place, its author and when it was written and removed. It has no `body` (the text is gone from
        the database) and does not say whether it was ever edited.
      required: [id, sequence, author, created_at, removed, removed_at]
      properties:
        id: {type: string}
        sequence: {type: integer, minimum: 1}
        author: {$ref: '#/components/schemas/DiscussionPerson'}
        created_at: {type: string, format: date-time}
        removed: {type: boolean, const: true}
        removed_at: {type: string, format: date-time}
    MessagePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DiscussionMessage'
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}

    ResourcePerson:
      type: object
      description: 'A Person as management shows them: the id and the current display name, never an Account, login email, role or security state. `display_name` is null only when Identity no longer holds the Person.'
      required: [id, display_name]
      properties:
        id: {type: string}
        display_name: {type: [string, 'null']}
    ResourceCategoryRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ResourceCategory:
      type: object
      description: 'A Category for management. `pack_count` counts the Packs that hold it, in any state.'
      required: [id, name, position, pack_count, created_by, updated_by, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 80}
        position: {type: integer, minimum: 1}
        pack_count: {type: integer, minimum: 0}
        created_by: {$ref: '#/components/schemas/ResourcePerson'}
        updated_by: {$ref: '#/components/schemas/ResourcePerson'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ResourceCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ResourceCategory'}
    ResourceCategoryName:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 320}
    ResourceOrder:
      type: object
      description: 'The COMPLETE ordered list of the ids of one sibling set (all Categories; the Packs of one Category; the Cards of one Pack). Anything other than exactly the current set is `order_mismatch`.'
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 1000
          items: {type: string}
    ResourceAudience:
      type: string
      description: 'A code-owned audience. Resources owns which audiences content targets, never who belongs to them.'
      enum: [guardian, member]
    ManagedPack:
      type: object
      description: >-
        A Pack for management. `revision` is the optimistic-concurrency token of the AUTHORED fields (title, summary, Series, Category):
        an edit must send the revision it was based on. Publication, audiences and order do not move it. `position` is the stored order
        within the Category and is never shown to a viewer. `cards` (every Card, Drafts included, without content) is present when one
        Pack is shown and absent from a list.
      required: [id, title, summary, is_series, category, position, state, revision, audiences, card_count, published_card_count, created_by, updated_by, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string, minLength: 1, maxLength: 200}
        summary: {type: [string, 'null'], maxLength: 300}
        is_series: {type: boolean}
        category:
          oneOf:
            - $ref: '#/components/schemas/ResourceCategoryRef'
            - type: 'null'
        position: {type: integer}
        state: {type: string, enum: [draft, published]}
        revision: {type: integer, minimum: 1}
        audiences:
          type: array
          items: {$ref: '#/components/schemas/ResourceAudience'}
        card_count: {type: integer, minimum: 0}
        published_card_count: {type: integer, minimum: 0}
        created_by: {$ref: '#/components/schemas/ResourcePerson'}
        updated_by: {$ref: '#/components/schemas/ResourcePerson'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        cards:
          type: array
          items: {$ref: '#/components/schemas/ManagedCardOutline'}
    ManagedPackPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ManagedPack'}
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
            last_page: {type: integer}
    ManagedPackList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ManagedPack'}
    ManagedCardOutline:
      type: object
      description: >-
        A Card for management without its content. `type` is fixed at creation. `audience_mode` is `inherit` (the Pack's audiences,
        and `audiences` is empty) or `narrowed` (a fixed, non-empty subset of the Pack's). `summary_mode` is `derived` (follows the content) or
        `custom` (never overwritten by content changes). `uri` is required for `external_link`, optional for `basic` and absent for
        `file`. `file` describes a `file` Card's file (null for any other Type): never where it is stored.
      required: [id, pack_id, position, type, title, summary_mode, summary, uri, file, audience_mode, audiences, state, revision, created_by, updated_by, created_at, updated_at]
      properties:
        id: {type: string}
        pack_id: {type: string}
        position: {type: integer}
        type: {type: string, enum: [basic, external_link, file]}
        title: {type: string, minLength: 1, maxLength: 200}
        summary_mode: {type: string, enum: [derived, custom]}
        summary: {type: string, maxLength: 300}
        uri: {type: [string, 'null'], maxLength: 2048}
        file:
          oneOf:
            - $ref: '#/components/schemas/ResourceFileSummary'
            - {type: 'null'}
        audience_mode: {type: string, enum: [inherit, narrowed]}
        audiences:
          type: array
          items: {$ref: '#/components/schemas/ResourceAudience'}
        state: {type: string, enum: [draft, published]}
        revision: {type: integer, minimum: 1}
        created_by: {$ref: '#/components/schemas/ResourcePerson'}
        updated_by: {$ref: '#/components/schemas/ResourcePerson'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ManagedCard:
      description: 'A Card with its content, for management. For a `file` Card, `file` is the fuller ManagedResourceFile.'
      allOf:
        - $ref: '#/components/schemas/ManagedCardOutline'
        - type: object
          required: [content]
          properties:
            content: {$ref: '#/components/schemas/ResourceContent'}
            file:
              oneOf:
                - $ref: '#/components/schemas/ManagedResourceFile'
                - {type: 'null'}
    ResourceFileSummary:
      type: object
      description: 'A File Card''s file as a list shows it: its sanitised original name, its detected and allowlisted media type, and its size.'
      required: [name, media_type, byte_size]
      properties:
        name: {type: string, maxLength: 255}
        media_type:
          type: string
          enum: [application/pdf, image/png, image/jpeg, image/webp, image/gif, text/plain, text/csv, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.openxmlformats-officedocument.presentationml.presentation]
        byte_size: {type: integer, minimum: 1}
    ManagedResourceFile:
      description: >-
        A File Card's file for management: also its SHA-256 digest, who uploaded it and when, whether the store holds it now
        (`available` false means a download answers `asset_unavailable`, after a partial restore, say), and the management path that
        serves it. Never a storage key, disk or directory.
      allOf:
        - $ref: '#/components/schemas/ResourceFileSummary'
        - type: object
          required: [sha256, uploaded_by, uploaded_at, available, download_path]
          properties:
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            uploaded_by: {$ref: '#/components/schemas/ResourcePerson'}
            uploaded_at: {type: string, format: date-time}
            available: {type: boolean}
            download_path: {type: string, description: 'The API path (no host) of downloadManagedResourceFile for this Card.'}
    DeliveredResourceFile:
      description: 'A visible File Card''s file as a viewer receives it, with the library path that serves it to them. Nothing management sees.'
      allOf:
        - $ref: '#/components/schemas/ResourceFileSummary'
        - type: object
          required: [download_path]
          properties:
            download_path: {type: string, description: 'The API path (no host) of downloadResourceFile for this Card.'}
    ResourceFileUpload:
      type: object
      description: 'One file, as a multipart part named `file`. The part''s claimed Content-Type is ignored.'
      required: [file]
      properties:
        file: {type: string, format: binary}
    NewResourceFileCard:
      type: object
      description: 'A `file` Card, as a multipart form. `content`, when sent, is the JSON text of a ResourceDocument; blank is none.'
      required: [type, title, file]
      properties:
        type: {type: string, enum: [file]}
        title: {type: string, maxLength: 800}
        content: {type: string, maxLength: 1048576}
        summary: {type: string, maxLength: 1200}
        file: {type: string, format: binary}
    FileTooLargeError:
      type: object
      required: [message, code, max_bytes]
      properties:
        message: {type: string}
        code: {type: string, enum: [file_too_large]}
        max_bytes: {type: integer, description: 'The configured limit, in bytes.'}
    ResourceContent:
      type: object
      description: 'A Card''s rich content as the platform keeps it. HTML is never stored, accepted or returned.'
      required: [format, version, document]
      properties:
        format: {type: string, enum: [prosemirror]}
        version: {type: integer, enum: [1]}
        document: {$ref: '#/components/schemas/ResourceDocument'}
    ResourceDocument:
      type: object
      description: >-
        A document in the Resources profile v1 (ADR 0037): the ONLY content the server accepts. The server validates it and refuses
        (`invalid_content`, naming the path of the first offence) rather than strip anything. Blocks: `paragraph`, `heading` (`attrs.level`
        2-4), `bulletList`, `orderedList` (`attrs.start`), `listItem` (starts with a paragraph), `blockquote`, `horizontalRule`, `codeBlock`
        (plain text), `table`, `tableRow`, `tableHeader`, `tableCell` (`colspan`, `rowspan` 1-20; no nested table). Inline: `text`, `hardBreak`.
        Marks: `bold`, `italic`, `underline`, `code`, `link` (`attrs.href`: https, http or mailto). Anything else, including images,
        embeds, raw HTML, styles, classes and other attributes, is refused. At most 256 KiB, nesting depth 24. A line feed is allowed only
        inside a `codeBlock`; use `hardBreak` elsewhere. The stored form is canonical: fixed key order, fixed mark order, editor-default
        attributes dropped.
      required: [type]
      properties:
        type: {type: string, enum: [doc]}
        content:
          type: array
          items: {type: object}
    NewResourcePack:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 800}
        summary: {type: [string, 'null'], maxLength: 1200}
        is_series: {type: boolean}
        category_id: {type: [string, 'null']}
    UpdateResourcePack:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
        title: {type: string, maxLength: 800}
        summary: {type: [string, 'null'], maxLength: 1200}
        is_series: {type: boolean}
        category_id: {type: [string, 'null']}
    ResourcePackAudiences:
      type: object
      required: [audiences]
      properties:
        audiences:
          type: array
          items: {$ref: '#/components/schemas/ResourceAudience'}
    NewResourceCard:
      type: object
      description: 'A `basic` or `external_link` Card, as JSON. A `file` Card is a multipart form (NewResourceFileCard).'
      required: [type, title]
      properties:
        type: {type: string, enum: [basic, external_link]}
        title: {type: string, maxLength: 800}
        content: {oneOf: [{$ref: '#/components/schemas/ResourceDocument'}, {type: 'null'}]}
        uri: {type: [string, 'null'], maxLength: 4096}
        summary: {type: [string, 'null'], maxLength: 1200}
    UpdateResourceCard:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
        title: {type: string, maxLength: 800}
        content: {$ref: '#/components/schemas/ResourceDocument'}
        uri: {type: [string, 'null'], maxLength: 4096}
        summary: {type: string, maxLength: 1200}
        summary_mode: {type: string, enum: [derived, custom]}
    ResourceCardAudiences:
      type: object
      required: [mode]
      properties:
        mode: {type: string, enum: [inherit, narrowed]}
        audiences:
          type: array
          items: {$ref: '#/components/schemas/ResourceAudience'}
    StaleRevisionError:
      type: object
      description: 'The refusal for an edit based on an out-of-date revision (`stale_revision`), carrying the current Pack or Card; or another 409 coded refusal of that operation.'
      required: [message, code]
      properties:
        message: {type: string}
        code: {type: string}
        current:
          oneOf:
            - $ref: '#/components/schemas/ManagedPack'
            - $ref: '#/components/schemas/ManagedCard'
    PackNotPublishableError:
      type: object
      required: [message, code, unmet]
      properties:
        message: {type: string}
        code: {type: string, enum: [pack_not_publishable]}
        unmet:
          type: array
          items: {type: string, enum: [category, audience, published_card]}
    CardNotPublishableError:
      type: object
      required: [message, code, unmet]
      properties:
        message: {type: string}
        code: {type: string, enum: [card_not_publishable]}
        unmet:
          type: array
          items: {type: string, enum: [content, uri, file]}
    PublishedPackRequirementError:
      type: object
      required: [message, code]
      properties:
        message: {type: string}
        code: {type: string, enum: [published_pack_requirement]}
        requirement: {type: string, enum: [category, audience, published_card]}
    CardAudienceConflictError:
      type: object
      required: [message, code]
      properties:
        message: {type: string}
        code: {type: string}
        requirement: {type: string}
        cards:
          type: array
          items: {type: string}
    ResourcePack:
      type: object
      description: >-
        A Pack as a viewer receives it. Only the Cards this viewer may see are present, numbered `index` 1..`card_count` among
        themselves: a stored position, a hidden Card's id, title, summary, count or navigation slot never appears. One visible Card or several is the viewer's,
        not stored. No state, revision, audience or provenance.
      required: [id, title, summary, is_series, category, card_count, cards]
      properties:
        id: {type: string}
        title: {type: string}
        summary: {type: [string, 'null']}
        is_series: {type: boolean}
        category: {$ref: '#/components/schemas/ResourceCategoryRef'}
        card_count: {type: integer, minimum: 1}
        cards:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResourceDeliveredCard'}
    ResourceDeliveredCard:
      type: object
      description: 'A visible Card: its link (`uri`) or its file (`file`), whatever the Type, so a consumer can always offer its safe action.'
      required: [id, index, type, title, summary, uri, file, content]
      properties:
        id: {type: string}
        index: {type: integer, minimum: 1}
        type: {type: string, enum: [basic, external_link, file]}
        title: {type: string}
        summary: {type: string}
        uri: {type: [string, 'null']}
        file:
          oneOf:
            - $ref: '#/components/schemas/DeliveredResourceFile'
            - {type: 'null'}
        content: {$ref: '#/components/schemas/ResourceContent'}
    ResourceLibrary:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [category, packs]
            properties:
              category: {$ref: '#/components/schemas/ResourceCategoryRef'}
              packs:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [id, title, summary, is_series, card_count]
                  properties:
                    id: {type: string}
                    title: {type: string}
                    summary: {type: [string, 'null']}
                    is_series: {type: boolean}
                    card_count: {type: integer, minimum: 1}
    ResourcePackPreview:
      type: object
      description: >-
        What an audience would receive if the Pack were Published as it stands. `pack_state` is the Pack's real state; `audience_targeted`
        says whether the audience is among the Pack's; `visible` is false (and `pack` null) when that audience would see nothing.
      required: [audience, pack_state, audience_targeted, visible, pack]
      properties:
        audience: {$ref: '#/components/schemas/ResourceAudience'}
        pack_state: {type: string, enum: [draft, published]}
        audience_targeted: {type: boolean}
        visible: {type: boolean}
        pack:
          oneOf:
            - $ref: '#/components/schemas/ResourcePack'
            - type: 'null'
