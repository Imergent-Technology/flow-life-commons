        - $ref: '#/components/parameters/ResourcePackId'
        - $ref: '#/components/parameters/ResourceCardId'
        - name: disposition
          in: query
          required: false
          description: '`attachment` (the default) or `inline`. Inline is honoured only for a PDF or a raster image; any other file is still an attachment.'
          schema: {type: string, enum: [attachment, inline]}
      responses:
        '200':
          description: >-
