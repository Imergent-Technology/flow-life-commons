    post:
      operationId: resolveDiscussion
      summary: Mark a discussion resolved
      description: >-
        Needs `discussions.participate`; any participant may, because resolving destroys nothing and is undone by reopening. A resolved
        discussion stays readable and takes no new replies (`discussion_resolved`); authors may still correct or remove their own
        messages. Records who resolved it and when. Idempotent: resolving a resolved discussion succeeds and keeps the original resolver
        and time. Serialised against replies by the discussion's row lock, so a reply is never committed into a discussion already
        resolved. Not activity.
