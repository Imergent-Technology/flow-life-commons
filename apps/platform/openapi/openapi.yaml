# OpenAPI contract for the Flow Life platform API (v1).
#
# This file is the source of truth for the HTTP contract. Every route under
# /api/v1 must be described here and vice versa; tests/Feature/OpenApiContractTest.php
# fails when they drift. The Guardian Console will consume a TypeScript client
# generated from this file (see packages/api-client/README.md and ADR 0007).
openapi: 3.1.0
info:
  title: Flow Life Platform API
  version: 1.0.0
  description: >-
    Authoritative API for Flow Life organizational data, identity, authorization
    and workflows.


    **Implemented so far:** infrastructure health, Guardian Console session
    authentication (`login`, `logout`, `me`), capability-based authorization
    (see below), and the credential lifecycle (invitation acceptance, password
    recovery and password change), multi-factor authentication (authenticator
    enrolment, the sign-in challenge, recovery codes and recent-verification
    step-up), and **operator administration** (`/admin/...`: Accounts, invitations, role
    assignments, disable and re-enable, recovery of a lost second factor, and membership records —
    listing, inspecting, registering a Person with an initial grant, granting an additional term,
    and revoking a grant; ADR 0028), and the **People directory** (`/admin/people`, `/admin/contact-tags`:
    every Person with the contact methods, profile and tags CRM holds about them; ADR 0034).


    ## Authorization


    What a person may do is a set of **capabilities** (for example `console.access`),
    bundled into roles that are assigned to people. Capabilities are named by
    identifier. **Role names are never used to decide what to show or do**: `GET /me` and
    every other endpoint a caller's own access depends on speak only in capabilities. The
    one place roles appear is operator administration (`/admin/roles`, and the
    `assignments` an administered account holds), where they are *data being administered*,
    served by Access, that the Console renders and never interprets. The platform evaluates capabilities against the person's *current*
    assignments on every request: a revoked role takes effect on the next request with no
    new sign-in, and nothing about them is stored in the session or accepted from the
    client. A signed-in account without a capability receives `403`.


    ## Session authentication (Guardian Console)


    The Console signs in with a same-origin, host-only session cookie (ADR 0016).
    There is no bearer token and no CORS: the Console and the API share one origin.


    - **Cookie:** `__Host-flowlife-session`, `Secure`, `HttpOnly`, `Path=/`, no
      `Domain`, `SameSite=Lax`. It is set by any of these endpoints and sent back by
      the browser automatically. The same cookie is used locally: Chromium accepts a
      `Secure` `__Host-` cookie on plain-HTTP `*.localhost`, so development does not
      differ from production.

    - **CSRF:** these endpoints are stateful, so state-changing requests (`POST`) must
      pass Laravel's request-forgery check. A first request to any of them (for
      example `GET /me`) issues a JS-readable `XSRF-TOKEN` cookie; echo its value in
      an `X-XSRF-TOKEN` header. A browser request the browser itself marks
      `Sec-Fetch-Site: same-origin` is also accepted. Otherwise the answer is `419`.

    - **Inactivity:** 30 minutes of *request* inactivity ends the session. Any
      authenticated request refreshes it; this is not human-idle detection.

    - **Absolute lifetime:** 12 hours from authentication, regardless of activity.
      Re-authenticating starts a new one. A session that lacks its authentication
      time is treated as expired, never as unlimited.

    - **Auditing:** logins, failures, logouts, rate limiting and absolute expiry are
      recorded as security events (`Audit` module). Events are internal; there is no
      endpoint to read them yet.


    Stateless endpoints (such as `/health`) receive no cookie and need no token.


    ## Multi-factor authentication


    Access to the Guardian Console requires a **second factor** (ADR 0023). It is a property
    of the *surface*, not of a role: an account whose current access reaches the Console must
    sign in with a second factor, and an account that has an authenticator always uses it.
    Authorization is unchanged; this is authentication strength.


    - **Sign-in is two steps when a second factor is due.** `POST /login` with the right
      password answers **`202`** instead of `200`, and **establishes no session**: it starts a
      short-lived *pending sign-in* (5 minutes to challenge, 10 to enrol, measured from the
      password and never extended) held in the browser session. A pending sign-in is not
      authentication: `GET /me` answers `401`, and no authorization applies. It ends on success,
      after 5 wrong codes, when the password is replaced or the account disabled, or on expiry.
      A wrong password answers exactly as before, so nothing about whether an account has a
      second factor is revealed to someone who does not know the password.

    - **Finishing:** `POST /mfa/challenge` (an authenticator `code`, or one `recovery_code`), or,
      for an account with no authenticator yet, `POST /mfa/enrollment` then
      `POST /mfa/enrollment/confirm`. Only success establishes the authenticated session (a new
      session id and CSRF token, the same 30-minute inactivity and 12-hour absolute limits). The
      first three routes need the cookie and CSRF token like every stateful route, but not
      `sessionCookie` authentication: what they need is the pending sign-in.

    - **Authenticator.** Standard TOTP (RFC 6238: 6 digits, 30-second step, HMAC-SHA1), which every
      authenticator app supports. Codes from the current step and one either side are accepted, and
      each time step **once**. The secret is generated on the server, shown **once** (as a manual key
      and as an `otpauth://` URI to be drawn as a QR code *in the browser*, never sent to a QR
      service), and stored only encrypted. It cannot be read back. Nothing is enrolled by generating
      a secret: only a valid code from it makes the authenticator real, and until then the account
      is exactly as it was.

    - **Recovery codes.** Ten single-use codes, returned **once** when an authenticator is enrolled
      or when the codes are regenerated. They are stored only as one-way digests and cannot be
      shown again. A code stands in for the authenticator code at sign-in and wherever a second
      factor is asked for, and is spent exactly once.

    - **Managing it needs fresh proof.** Regenerating recovery codes and replacing the authenticator
      take the **current password and a second factor in the request body**; a session alone never
      changes or exposes a credential. There is no self-service way to switch MFA off.

    - **Recent verification (step-up).** A successful password-and-second-factor proof records
      `security_verified_at` on the session (`GET /me` reports `mfa.security_verified_until`).
      A route that demands it answers `403` with `verification_required: true` when the last
      proof is older than 15 minutes, and the caller re-proves with `POST /security/verify`.
      **Every mutation under `/admin` requires it** (operator administration, below).


    ## Operator administration


    `/admin/...` is the first surface that can alter another person's access (ADR 0024). It is
    inside the Console boundary (`console.access`, which already requires a second factor) and
    every operation is decided by **two independent checks**:

    - **A capability**, from Access, evaluated against current persisted state on every request:
      `identity.accounts.view` (list and inspect, and the role catalog),
      `identity.accounts.manage` (disable and re-enable), `identity.invitations.issue` (invite,
      and issue a fresh invitation), `identity.mfa.recover` (reset another account's second
      factor) and `access.roles.assign` (grant and revoke roles). A signed-in caller without it
      receives `403` **before** being asked to prove anything.

    - **Recent verification** for every mutation (not for reads): `403` with
      `verification_required: true` until the caller re-proves password and a second factor
      (`POST /security/verify`) within 15 minutes. A client re-proves and then asks again
      deliberately; nothing is retried on its behalf.


    Refusals the Console must tell apart carry a stable `code` (`409` and `422`):
    `last_administrator_required`, `email_already_in_use`, `invitation_not_issuable`,
    `account_not_disabled`, `mfa_not_enrolled`, `self_mfa_reset_prohibited`, `unknown_role`,
    `invalid_invitation_details`, `account_not_found`.


    An administered account is shown with administration-relevant fields only; **never** a
    password or hash, a factor secret or recovery code, an invitation token, a session id or
    anything from the audit trail.


    ## Passwords


    One password policy applies wherever a password is set (`/invitations/accept`,
    `/password/reset` and `/password/change`):

    - at least **15 Unicode code points**, and at most **72 UTF-8 bytes** (the limit of the
      bcrypt hashing the platform runs on; a longer password is refused, never truncated);

    - **no composition rules**: no required digits, cases or symbols, and spaces and Unicode
      are welcome. Nothing is trimmed: a password is used exactly as typed;

    - text is **normalised to Unicode NFC** before it is hashed or checked, so two spellings
      of the same text are the same password;

    - a password found in **public data breaches** is refused. The check sends only the
      first five characters of the password's SHA-1 to a range service (k-anonymity), never
      the password. If the service cannot be reached the answer is `503` with `Retry-After`:
      the password is neither accepted nor refused, and nothing is changed.

    Passwords, tokens and confirmations are secret-bearing request fields (`writeOnly`). They
    are never stored in plain text, logged or recorded in the audit trail.
servers:
  # The API shares an origin with the Guardian Console (ADR 0016), so the server
  # is a relative URL: it resolves against whichever host serves the Console.
  - url: /api/v1
    description: Same origin as the Guardian Console (local development at http://commons.flowlife.localhost:18080)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Platform health
      description: >-
        Infrastructure verification endpoint. Public and unauthenticated; exposes
        only coarse pass/fail status.
      tags: [System]
      responses:
        '200':
          description: All checks passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /login:
    post:
      operationId: login
      summary: Sign in
      description: >-
        Verifies an email address and password and, on success, establishes an
        authenticated session: the session id and CSRF token are regenerated and the
        response carries the new cookies.


        The email is matched by its canonical (lower-cased, trimmed) form. Only an
        `active` account may sign in. **Unknown address, wrong password, invited
        account and disabled account are indistinguishable:** all answer `401` with
        the same body, and the same amount of password-hashing work is done on each
        path.


        Attempts are rate limited by source address and by identifier (see `429`).
      tags: [Authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. Sets `__Host-flowlife-session` and `XSRF-TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
        '401':
          description: The credentials were not accepted. No further detail is given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: The request is malformed (missing fields, or an email that is not a valid address).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '202':
          description: >-
            The password was right but a **second factor is required**, so the caller is **not**
            signed in and no session was established. A pending sign-in was started (see
            "Multi-factor authentication"); `next` says whether to challenge (`challenge`: the
            account has an authenticator) or enrol one (`enrollment`). Only someone who proved the
            password is told this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSignIn'
        '429':
          description: Too many attempts from this address or against this identifier. Identical whether or not the identifier exists.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /logout:
    post:
      operationId: logout
      summary: Sign out
      description: >-
        Ends the session: it is invalidated and the session id and CSRF token are
        regenerated. The account and person are unchanged. Idempotent: with no
        authenticated session it does nothing and still answers `204`. (A request whose
        CSRF token is stale, for example after the session already lapsed, is refused
        with `419`; the client should fetch a fresh token with `GET /me` and treat itself
        as signed out.)
      tags: [Authentication]
      security:
        - sessionCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Signed out (or there was no session to end).
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /me:
    get:
      operationId: getCurrentAccount
      summary: The signed-in account
      description: >-
        Identity and session information for the current session, and nothing else.
        `capabilities` lists what the account may do **right now**, as identifiers in
        alphabetical order, derived fresh on each call (so a role revoked since sign-in
        is already gone). It is for presenting the Console; the server enforces every
        capability regardless. Role names are never returned.


        Also the way a client that has no session yet obtains its `XSRF-TOKEN` cookie:
        an anonymous call answers `401` and still sets the cookies needed to sign in.
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
        '401':
          description: Not signed in, or the session has expired (inactivity, absolute lifetime, or the account can no longer authenticate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /my/membership:
    get:
      operationId: getCurrentMembership
      summary: The signed-in account's own membership
      description: >-
        Self-service (ADR 0032, docs/architecture/member-access.md): authentication is the whole
        requirement. No capability, no `console.access`, and the Person is always the caller's own
        — there is no way to ask about anyone else. `active: false` (never a member, or a lapsed
        one) is as ordinary an answer as `active: true`: reaching this endpoint is never itself
        evidence of membership. Excludes every administrative fact about a grant (who granted or
        revoked it, why, any provenance reference); see `GET /admin/members/{person}` for that view.
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's own membership state and grant history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMembership'
        '401':
          description: Not signed in, or the session has expired (inactivity, absolute lifetime, or the account can no longer authenticate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation and choose a password
      description: >-
        Completes an invited account. The caller presents the one-time invitation token they
        were given and chooses a password; the account becomes `active`. **It does not sign
        the caller in:** they then use `POST /login`.


        Public and stateless: no session, cookie or CSRF token is involved. The token is sent
        in the **body**, never in a URL, so routine access logs do not capture it. It is
        hashed before it is looked up and is never stored, logged or audited.


        **An unusable invitation has exactly one answer.** Unknown, malformed, expired,
        already accepted, revoked, or belonging to an account that can no longer accept it
        are indistinguishable (`422` with an error on `token`). The password is judged
        first, so a weak password gets the same answer whatever the token is.


        An invitation can be accepted **once**: of two simultaneous requests with the same
        token at most one succeeds. Nothing is partly applied: the password, the activation
        and the invitation's use are committed together or not at all. A concurrent disable
        of the account wins; acceptance never re-enables it.


        Whether acceptance verifies the email address depends on **how the invitation was
        delivered**, which is fixed when it is issued. `email_verified_at` means the platform has
        evidence the holder controls the mailbox. An invitation the platform **emailed** to the
        address (operator administration) is that evidence, so accepting it sets
        `email_verified_at`. An invitation whose token an operator handed over (the
        administrator bootstrap) says nothing about the mailbox, so its account becomes active
        with the email still **unverified**; it can sign in all the same, because nothing
        makes verification a condition of signing in.


        Limited by source address (see `429`).
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: The password is set and the account is active. No session was created.
        '422':
          description: >-
            The request was not accepted and nothing was changed. `errors.token` for any
            unusable invitation (one answer for every reason), `errors.password` for a
            password that does not meet the policy (with a reason for each), or a
            confirmation that does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          description: >-
            The breached-password check is unavailable, so the password could not be judged.
            Nothing was changed; retry after the interval given.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password-reset email
      description: >-
        "I forgot my password." If an account exists for the address **and can sign in today**
        (active, with a password), a single-use reset link is emailed to it. Nothing about the
        account is disclosed.


        **The answer never depends on the address.** An active account, an unknown address, an
        invited account and a disabled account all receive the same `202` and body, and the
        request is held to a minimum duration so the time it takes does not tell them apart
        either. Only an eligible account is sent anything, and at most one message a minute.
        A malformed address is refused with `422` (that reveals the address's shape, not
        whether it has an account). The rate limit answers `429` identically whether or not
        the address exists.


        The emailed link points at the Guardian Console's reset page (`/reset-password`) and carries the token and the address in the URL **fragment**
        (`#token=...&email=...`), which a browser never sends to a server, so neither reaches
        access logs or `Referer` headers. The page reads them and calls `POST /password/reset`.
        The token lasts 60 minutes, works once, and is stored only as a hash.


        Public and stateless: no session, cookie or CSRF token. Limited by source address and
        by address.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted. This is the answer whether or not an email was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: The request is malformed (missing, or an email that is not a valid address).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests from this address, or for this identifier. Identical whether or not the identifier exists.
          headers:
            Retry-After:
              description: Seconds until another request is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /password/reset:
    post:
      operationId: resetPassword
      summary: Choose a new password with a reset token
      description: >-
        Completes a password reset with the emailed token. It **does not sign the caller in**,
        and it **ends every session the account has** (a reset is what someone does when a
        credential may be compromised). It cannot activate an invited account or re-enable a
        disabled one: only an account that can sign in today qualifies, and a concurrent
        disable wins.


        The token is sent in the **body**, never a URL. It is single-use: it is deleted with the
        password change, and of two simultaneous requests with the same token at most one
        succeeds. The password change, the token's deletion, the ending of the sessions and
        the audit record commit together or not at all.


        **One answer for every failure:** an unknown address, an account that cannot be reset,
        and a missing, wrong, used or expired token are indistinguishable (`422` with an error
        on `token`), and each does the same hashing work. The password is judged first and does
        not consume the token, so a weak password can be corrected and resubmitted.


        Public and stateless: no session, cookie or CSRF token. Limited by source address and
        by address.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: The password was changed and every session of the account ended. No session was created.
        '422':
          description: >-
            Nothing was changed. `errors.token` for any unusable reset (one answer for every
            reason), `errors.password` for a password that does not meet the policy (with a
            reason for each), or a confirmation that does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts from this address, or for this identifier.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          description: >-
            The breached-password check is unavailable, so the password could not be judged.
            Nothing was changed and the token is still valid; retry after the interval given.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /password/change:
    post:
      operationId: changePassword
      summary: Change the signed-in account's password
      description: >-
        Changes the password of the signed-in account. **A session alone is not enough:** the
        caller must re-prove the **current password**, which is the re-authentication control
        until step-up authentication (MFA) exists. The current password is verified against the
        credential as it is at the moment of the change, under a lock, so a reset or change that
        committed a moment ago is honoured; a concurrent disable wins and the answer is `401`.


        On success:

        - every **other** session of the account is ended;

        - **this** session is rotated: a new session id and CSRF token (the response carries the
          new cookies, and the old session id stops working), and

        - its **authentication instant is restarted**: the current password was just proved, so
          the 12-hour absolute lifetime runs from now (`GET /me` shows the new
          `session.authenticated_at`).


        A wrong current password, or a new password that does not meet the policy, changes
        nothing at all, including the session. Repeated wrong attempts are rate limited per
        account and per source address, so a stolen session cannot be used to guess the current
        password. Stateful: needs the session cookie and CSRF token like `POST /logout`.
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: >-
            The password was changed, every other session ended, and this one was rotated. Sets
            a new `__Host-flowlife-session` and `XSRF-TOKEN`.
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: >-
            Nothing was changed. `errors.current_password` if the current password is wrong,
            `errors.password` for a new password that does not meet the policy (with a reason for
            each), or a confirmation that does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          description: >-
            The breached-password check is unavailable, so the new password could not be judged.
            Nothing was changed; retry after the interval given.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /mfa/challenge:
    post:
      operationId: completeMfaChallenge
      summary: Finish a sign-in with a second factor
      description: >-
        Finishes a sign-in whose password was proved (`POST /login` answered `202` with
        `next: challenge`). Present **either** an authenticator `code` **or** one `recovery_code`.
        On success the authenticated session is established (a new session id and CSRF token), the
        response is the same as a password-only sign-in, and `mfa.security_verified_until` shows the
        session as freshly verified.


        Everything is decided from **current** state, first and under a lock: the account must still
        be able to sign in, and the password that was proved must still be the stored one, so an
        account disabled, or a password replaced, after the password was accepted **cannot** finish.
        A recovery code is spent exactly once: of two simultaneous uses at most one succeeds. An
        authenticator code is accepted once per time step.


        A wrong code is `422` and counts toward ending the pending sign-in (5 wrong codes). Every
        other reason it cannot continue (nothing pending, expired, ended, account no longer able to
        sign in, password replaced) is the **same** `401`, so the answer reveals nothing about the
        account. Rate limited per account and per source address.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
      responses:
        '200':
          description: Signed in. Sets a new `__Host-flowlife-session` and `XSRF-TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
        '401':
          description: There is no usable pending sign-in. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: The code is not valid (`errors.code` or `errors.recovery_code`), or the request is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /mfa/enrollment:
    post:
      operationId: beginMfaEnrollment
      summary: Get an authenticator secret to enrol (pending sign-in)
      description: >-
        For a pending sign-in with `next: enrollment` (a second factor is required and the account has
        none). Generates a secret and returns it **once**, as a manual `secret` and an `otpauth_uri`
        to be rendered as a QR code in the browser. It is stored only encrypted, as **pending**:
        **nothing is enrolled** by asking, and it cannot be used to sign in. Asking again replaces
        the earlier pending secret, so an abandoned attempt strands no one. Not cacheable.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: The secret and provisioning URI. Shown once; never available again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorSetup'
        '401':
          description: There is no usable pending enrolment. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      summary: Prove the authenticator, enrol it, and finish signing in
      description: >-
        Proves possession of the secret from `POST /mfa/enrollment` with a valid **current** code from
        it. Only this makes the authenticator real. On success, in one transaction: the authenticator
        is enrolled, ten recovery codes are stored (as digests) and returned **once**, `mfa.enabled`
        and the sign-in are recorded, and the authenticated session is established (a new session id
        and CSRF token). A wrong code changes nothing and the pending secret stays for another try.
        As with the challenge, the account and the password proved are re-checked from current state
        first. Not cacheable; the recovery codes are shown once.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: Enrolled and signed in. Sets a new `__Host-flowlife-session` and `XSRF-TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          description: There is no usable pending enrolment. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: The code is not valid (`errors.code`), or the request is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      description: >-
        Replaces the signed-in account's recovery codes with a new set, returned **once**. Fresh proof
        is required in the body: the **current password and a second factor** (`code` or
        `recovery_code`); a session alone is never enough. Every earlier code, used or not, stops
        working in the same transaction. On success the session is rotated (new id and CSRF token)
        and recorded as freshly verified. Rate limited per account and per source address, so a
        stolen session cannot be used to guess the password or a code.
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityProofRequest'
      responses:
        '200':
          description: The new recovery codes. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Nothing was changed. `errors.current_password`, `errors.code` or `errors.recovery_code`, or a malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /mfa/authenticator:
    post:
      operationId: beginAuthenticatorReplacement
      summary: Start replacing the authenticator
      description: >-
        Starts replacing the signed-in account's authenticator (a new phone, say). Fresh proof in the
        body: the **current password and a second factor**. Returns a **new** secret and provisioning
        URI **once**, as *pending*: the authenticator in use **keeps working** until the new one is
        proved with `POST /mfa/authenticator/confirm`, so an abandoned or failed replacement cannot
        strand the account. Asking again replaces the pending secret. On success the session is
        rotated and recorded as freshly verified. Not cacheable.
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityProofRequest'
      responses:
        '200':
          description: The new secret, provisioning URI and `expires_at`. Shown once; the old authenticator still works.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorSetup'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Nothing was changed. `errors.current_password`, `errors.code` or `errors.recovery_code`, or a malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /mfa/authenticator/confirm:
    post:
      operationId: confirmAuthenticatorReplacement
      summary: Prove the new authenticator and switch to it
      description: >-
        Proves the **new** authenticator with a valid current code from the secret that
        `POST /mfa/authenticator` generated. Only now does it replace the old one, which **stops
        working from this instant**. In one transaction, the account's **other** sessions end (a
        credential was replaced) and `mfa.replaced` is recorded; this session is rotated. Recovery
        codes are untouched. No password is asked here: the fresh proof was given when the
        replacement began. A wrong code, or no setup in progress, changes nothing.
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '204':
          description: The new authenticator is active; every other session of the account ended. Sets a new `__Host-flowlife-session` and `XSRF-TOKEN`.
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Nothing was changed. `errors.code` for a wrong code, or `errors.authenticator` when no replacement is in progress (or it went stale).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /security/verify:
    post:
      operationId: verifySecurityAccess
      summary: Re-prove the password and a second factor (step-up)
      description: >-
        Step-up. The signed-in account re-proves the **current password and a second factor**, and the
        session records `security_verified_at` (the session id and CSRF token are rotated). A route
        behind the step-up requirement (`403` with `verification_required: true`) then accepts the
        caller for the next 15 minutes. It changes nothing else: not the session's authentication
        time, not the account. Rate limited per account and per source address.
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityProofRequest'
      responses:
        '204':
          description: Verified. Sets a new `__Host-flowlife-session` and `XSRF-TOKEN`; `GET /me` shows `mfa.security_verified_until`.
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Nothing was changed. `errors.current_password`, `errors.code` or `errors.recovery_code`, or a malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts for this account or from this address.
          headers:
            Retry-After:
              description: Seconds until another attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /admin/accounts:
    get:
      operationId: listManagedAccounts
      summary: List Accounts
      description: >-
        Needs `identity.accounts.view`. A modest, bounded page (25 by default, at most 100) ordered by
        display name, optionally narrowed by a plain fragment `q` of the email or name (a `%` or `_` is a
        character, not a wildcard) and by `status`. There is no query language. Read-only.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.accounts.view
      x-requires-recent-verification: false
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: status
          in: query
          schema: {type: string, enum: [invited, active, disabled]}
      responses:
        '200':
          description: A page of Accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccountPage'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Signed in, but the account does not hold the required capability (or cannot use the Console).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: A malformed `page`, `per_page` or `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /admin/accounts/{account}:
    get:
      operationId: getManagedAccount
      summary: Inspect an Account
      description: >-
        Needs `identity.accounts.view`. Read-only.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.accounts.view
      x-requires-recent-verification: false
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Signed in, but the account does not hold the required capability (or cannot use the Console).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: No such Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
  /admin/roles:
    get:
      operationId: listRoleCatalog
      summary: List the system roles
      description: >-
        Needs `identity.accounts.view`. The role catalog, **from Access**: a stable key, words for a screen,
        and the capabilities the role grants (informational). The Console renders this as data and
        defines no role of its own. Read-only.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.accounts.view
      x-requires-recent-verification: false
      responses:
        '200':
          description: The system roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCatalog'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Signed in, but the account does not hold the required capability (or cannot use the Console).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /admin/invitations:
    post:
      operationId: inviteOperator
      summary: Invite a new operator
      description: >-
        Needs `identity.invitations.issue` (and `access.roles.assign` when roles are chosen) **and recent
        verification**. In one transaction it creates a Person, an *invited* Account with no password, a
        single-use expiring invitation and any initial role assignments (each audited); if any part fails
        none remains and nothing is mailed. The invitation is then **emailed to the address, after the commit
        and outside it**, with the secret in the URL *fragment* of a link to the Console.


        **`201` means the Account exists**, whether or not the message could be sent: `delivery.status` is
        `sent` or `failed`. On `failed` the state stays committed and the remedy is
        `POST /admin/accounts/{account}/invitation`. The response **never** contains the invitation secret.
        Accepting an emailed invitation verifies the email address. An Account with no role can be created; it
        simply cannot enter the Console.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.invitations.issue
      x-requires-recent-verification: true
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteOperatorRequest'
      responses:
        '201':
          description: The Account, and whether the invitation was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: 'Either the account lacks the capability (`message` only), or its last password-and-second-factor proof is older than 15 minutes (`verification_required: true`): re-prove with `POST /security/verify` and ask again. Nothing was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredOrDenied'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '409':
          description: 'An account already uses that address (`code: email_already_in_use`). Nothing was changed or sent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
        '422':
          description: An invalid address or name (`invalid_invitation_details`), an unknown role key (`unknown_role`), or a malformed request. Nothing was changed or sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedValidationError'
  /admin/accounts/{account}/invitation:
    post:
      operationId: reissueInvitation
      summary: Issue a fresh invitation
      description: >-
        Needs `identity.invitations.issue` **and recent verification**. For an Account that is still *invited*
        (its invitation expired, the message was lost, or delivery failed): deletes every unaccepted invitation
        of the Account and issues one fresh one, emailed after the commit, so exactly one is ever usable.
        Never for an active Account (`409 invitation_not_issuable`). The secret is never returned.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.invitations.issue
      x-requires-recent-verification: true
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: The Account, and whether the new invitation was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: 'Either the account lacks the capability (`message` only), or its last password-and-second-factor proof is older than 15 minutes (`verification_required: true`): re-prove with `POST /security/verify` and ask again. Nothing was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredOrDenied'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: No such Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
        '409':
          description: The Account is not invited (`invitation_not_issuable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
  /admin/accounts/{account}/password-reset:
    post:
      operationId: sendPasswordReset
      summary: Send a password reset email
      description: >-
        Needs `identity.accounts.manage` **and recent verification**. Sends the Account holder the SAME password-reset email
        they would get from "I forgot my password", so they can set their own password: the operator never chooses, sees or
        receives the password, the reset token or the link, and this does not reset the authenticator. It issues through the
        existing reset mechanism (one live token per Account, the usual lifetime, the usual reset page), is audited as
        `password.reset_requested_by_operator`, and the message is sent after the commit. Only an Account that can sign in:
        an *invited* Account has no password to reset (`409 password_reset_account_invited`: send a new invitation) and a
        *disabled* one is not recovered (`409 password_reset_account_disabled`). The public one-a-minute rule applies
        (`409 password_reset_recently_requested`), and so does a per-Account limit on how many such emails one inbox can be sent over the window (`429`, like inviting again). The request has no body.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.accounts.manage
      x-requires-recent-verification: true
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: The Account, and whether the message was sent. `failed` means the mail system did not accept it; send again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResult'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: 'Either the account lacks the capability (`message` only), or its last password-and-second-factor proof is older than 15 minutes (`verification_required: true`): re-prove with `POST /security/verify` and ask again. Nothing was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredOrDenied'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: No such Account (`account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
        '409':
          description: The Account is invited (`password_reset_account_invited`) or disabled (`password_reset_account_disabled`), or was sent a reset a moment ago (`password_reset_recently_requested`). Nothing was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
        '429':
          description: Too many reset emails have been sent to this Account (or requested from this address) lately. Nothing was sent. This bounds the mail one inbox can receive, over and above the one-a-minute rule.
          headers:
            Retry-After:
              description: Seconds until another request is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /admin/people/{person}/invitation:
    post:
      operationId: inviteExistingPerson
      summary: Invite an existing Person to Commons
      description: >-
        Needs `identity.invitations.issue` **and recent verification** — the same capability that
        governs `POST /admin/invitations`. For a Person who already exists and has no Account yet
        (most likely one Membership registered with `POST /admin/members` and no Account): creates
        an *invited* Account with no password and a single-use, EMAIL-channel invitation, then
        emails it after the commit, outside it, with the secret in the URL *fragment*. Unlike
        `POST /admin/invitations`, no new Person is created and no role is assigned here.


        **`201` means the Account exists**, whether or not the message could be sent:
        `delivery.status` is `sent` or `failed`. On `failed` the state stays committed and the
        remedy is `POST /admin/accounts/{account}/invitation`, the same reissue endpoint every
        other invited Account uses. The response **never** contains the invitation secret.
      tags: [Administration]
      security:
        - sessionCookie: []
      x-required-capability: identity.invitations.issue
      x-requires-recent-verification: true
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteExistingPersonRequest'
      responses:
        '201':
          description: The Account, and whether the invitation was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '401':
          description: Not signed in, the session has expired, or the account can no longer sign in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: 'Either the account lacks the capability (`message` only), or its last password-and-second-factor proof is older than 15 minutes (`verification_required: true`): re-prove with `POST /security/verify` and ask again. Nothing was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredOrDenied'
        '419':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: No such Person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedMessage'
        '409':
          description: 'The Person already has an Account (`code: person_already_has_account`), or another account already uses that address (`code: email_already_in_use`). Nothing was changed or sent.'
          content:
