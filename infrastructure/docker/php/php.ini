; Development-only PHP settings. Production settings belong to the cPanel host.
memory_limit = 512M
display_errors = On
error_reporting = E_ALL
date.timezone = UTC
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Resources' managed files (ADR 0037, decision 64): PHP must let the largest allowed file reach the application, which refuses
; anything over RESOURCES_ASSET_MAX_BYTES (20 MiB by default) itself. post_max_size leaves room for the rest of the form.
; `security:production-check` requires the same of the production host. The stock values were 2M and 8M.
upload_max_filesize = 20M
post_max_size = 24M

; Do not announce the PHP version in an X-Powered-By header. It tells an attacker which patch
; level to look up and tells a user nothing (ADR 0026). Set here so development matches what the
; production host must also be set to; the production checklist makes it an owner verification,
; because this image is not what runs there.
expose_php = Off
